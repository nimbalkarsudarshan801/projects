<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Reset your SraswatiLibrary password.">
  <title>SraswatiLibrary — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/public.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>

  <nav class="public-nav">
    <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Log in</a>
    </div>
  </nav>

  <div style="display:flex;flex:1;align-items:center;justify-content:center;padding:var(--space-16)">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">Sraswati<span style="color:#FFC247">Library</span></div>
        <p style="color:var(--text-muted);font-size:14px">Create a new password. Demo reset tokens accepted: <code style="background:var(--border);padding:2px 6px;border-radius:4px">demo-reset-token</code> or <code style="background:var(--border);padding:2px 6px;border-radius:4px">reset-1234</code>.</p>
      </div>
      <form id="resetForm" novalidate>
        <div class="field">
          <label class="lbl">Reset token</label>
          <input type="text" id="token" name="token" class="input" placeholder="demo-reset-token" required>
          <div class="field-error" id="tokenError"></div>
        </div>
        <div class="field input-group">
          <label class="lbl">New password</label>
          <input type="password" id="password" name="password" class="input" placeholder="••••••••" required>
          <div class="password-strength" id="strengthBar"><div class="password-strength-bar" id="strengthFill"></div></div>
          <div class="password-strength-text" id="strengthText"></div>
          <div class="field-error" id="passwordError"></div>
        </div>
        <div class="field input-group">
          <label class="lbl">Confirm new password</label>
          <input type="password" id="confirm" name="confirm" class="input" placeholder="••••••••" required>
          <div class="field-error" id="confirmError"></div>
        </div>
        <div class="field-error" id="formError" style="margin-bottom:var(--space-12)"></div>
        <div class="form-actions">
          <button type="button" class="btn sec" onclick="window.location.href='login.html'">Cancel</button>
          <button type="submit" class="btn pri full" id="resetBtn">Reset password</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { __sraswati_auth as auth, __sraswati_validators as v, __sraswati_notifications as notify } from './js/app.js';

    const form = document.getElementById('resetForm');
    const tokenEl = document.getElementById('token');
    const passEl = document.getElementById('password');
    const confirmEl = document.getElementById('confirm');
    const errs = { token: document.getElementById('tokenError'), password: document.getElementById('passwordError'), confirm: document.getElementById('confirmError') };
    const formErr = document.getElementById('formError');
    const btn = document.getElementById('resetBtn');
    const bar = document.getElementById('strengthFill');
    const txt = document.getElementById('strengthText');

    function clear(k) { errs[k].textContent = ''; document.getElementById(k).classList.remove('error'); }
    function show(k, msg) { errs[k].textContent = msg; document.getElementById(k).classList.add('error'); }

    passEl.addEventListener('input', () => {
      const s = v.passwordStrength(passEl.value);
      bar.style.width = `${Math.min(s.score, 4) * 25}%`;
      bar.className = 'password-strength-bar ' + (s.level <= 3 ? 'warn' : 'ok');
      txt.textContent = s.feedback;
      txt.className = 'password-strength-text ' + (s.level <= 2 ? 'bad' : 'ok');
    });

    [tokenEl, passEl, confirmEl].forEach(el => el.addEventListener('input', () => clear(el.id)));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      Object.values(errs).forEach(x => x.textContent = '');
      formErr.textContent = '';
      const rules = {
        token: [v.required],
        password: [v.required, v.minLength.bind(null, _, 8)],
        confirm: [v.required, v.confirmPassword.bind(null, _, passEl.value)],
      };
      const r = v.validate(rules, { token: tokenEl.value, password: passEl.value, confirm: confirmEl.value });
      if (!r.valid) { Object.entries(r.errors).forEach(([k, m]) => show(k, m)); return; }
      btn.disabled = true; btn.textContent = 'Resetting…';
      const res = auth.resetPassword(tokenEl.value, passEl.value);
      btn.disabled = false; btn.textContent = 'Reset password';
      if (res.ok) { notify.success(res.message); setTimeout(() => { window.location.href = 'login.html'; }, 1000); }
      else { notify.error(res.error || 'Reset failed.'); formErr.textContent = res.error || 'Invalid or expired token.'; }
    });
  </script>
</body>
</html>
