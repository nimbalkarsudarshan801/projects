<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Fines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Student Portal · Fines</div>
      <nav class="dashboard-nav" id="studentNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="studentLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Fines</div><div class="page-subtitle">Late fees and outstanding balance</div></div><a class="btn sec" href="book-loans.html">My loans</a></header>
      <div id="finesView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_fines as fn, __sraswati_payments as p, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('studentNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('studentLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'student';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('fines.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const list = fn.finesForUser(u.id).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      const outstanding = fn.outstandingForUser(u.id);
      const el = document.getElementById('finesView');
      el.innerHTML = `
        <div style="display:flex;gap:var(--space-12);align-items:flex-end;margin-bottom:var(--space-16)">
          <div class="dashboard-stat"><div class="stat">${f.currency(outstanding)}</div><div class="stat-label">Outstanding</div></div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Reason</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>${list.map(fine => `
        <tr><td>${fine.reason}</td><td>${f.currency(fine.amount)}</td><td><span class="tag ${fine.status === 'paid'?'ok':fine.status === 'waived'?'neu':'bad'}">${fine.status}</span></td><td>${f.dateShort(fine.createdAt)}</td><td>`;
        if(fine.status === 'unpaid') return `<button class="btn pri sm" onclick="pay('${fine.id}')">Pay ${f.currency(fine.amount)}</button>`;
        return `<span class="tag neu">—</span>`;
      }).join('')}</tbody></table></div>`;
      window.pay = (id) => {
        const fine = fn.findFine(id);
        if(!fine) return;
        if(!confirm(`Pay fine of ${f.currency(fine.amount)}?`)) return;
        const res = fn.payFine(id, u.id, u.id);
        if(res.ok){ notify.success('Fine paid (pending verification).'); render(); } else { notify.error(res.error); }
      };
    }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['student'])) return;
    render();
  </script>
</body>
</html>
