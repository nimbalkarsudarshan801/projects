<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Student Portal · Books</div>
      <nav class="dashboard-nav" id="studentNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="studentLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar">
        <div><div class="dashboard-title">Catalogue</div><div class="page-subtitle">Browse and search books</div></div>
        <div class="table-actions">
          <input type="text" id="bookSearch" class="input" style="width:260px" placeholder="Search title, author, ISBN…">
        </div>
      </header>
      <div id="booksView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_books as b, __sraswati_loans as l, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('studentNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('studentLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'student';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('books.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const q = document.getElementById('bookSearch').value;
      const list = b.searchBooks({ q });
      const el = document.getElementById('booksView');
      if(list.length === 0){ el.innerHTML = '<div class="empty-state"><h3>No books found</h3><p>Try a different search.</p></div>'; return; }
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Cover</th><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Available</th><th>Action</th></tr></thead><tbody>${list.map(book => {
        const inv = b.inventoryForBook(book.id);
        return `<tr><td><div class="book-cover" style="background:${book.cover}">${book.title.slice(0,2)}</div></td><td><div class="book-info"><h4>${book.title}</h4><p>${book.author}</p></div></td><td>${book.isbn}</td><td>${book.category}</td><td><span class="tag ${inv.available>0?'ok':'bad'}">${inv.available}</span></td><td><a class="btn pri sm" href="book-details.html?id=${book.id}">View details</a></td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    document.getElementById('bookSearch').addEventListener('input', render);
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['student'])) return;
    render();
  </script>
</body>
</html>
