<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Session history</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Student Portal · Sessions</div>
      <nav class="dashboard-nav" id="studentNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="studentLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Session history</div><div class="page-subtitle">Your active and past sessions</div></div></header>
      <div id="sessionsView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_sessions as sess, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('studentNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('studentLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'student';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('session-history.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const list = sess.allSessions().filter(x => x.userId === u.id).sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt));
      const el = document.getElementById('sessionsView');
      if(list.length === 0){ el.innerHTML = '<div class="empty-state"><h3>No sessions</h3></div>'; return; }
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Device</th><th>Started</th><th>Last activity</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(s => `
      <tr><td>${s.device}</td><td>${f.dateTime(s.startedAt)}</td><td>${f.dateTime(s.lastActivity)}</td><td><span class="tag ${s.status === 'active'?'ok':'neu'}">${s.status}</span></td><td>${s.status === 'active' ? `<button class="btn danger sm" onclick="revoke('${s.id}')">Revoke</button>` : `<span class="tag neu">Revoked</span>`}</td></tr>`).join('')}</tbody></table></div>`;
      window.revoke = (id) => {
        if(!confirm('Revoke this session?')) return;
        const res = sess.revokeSession(id);
        if(res.ok){ notify.success('Session revoked.'); render(); } else { notify.error(res.error); }
      };
    }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['student'])) return;
    render();
  </script>
</body>
</html>
