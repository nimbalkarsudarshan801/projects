<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — My Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Student Portal · Bookings</div>
      <nav class="dashboard-nav" id="studentNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="studentLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">My bookings</div><div class="page-subtitle">Seat booking history and status</div></div><a class="btn sec" href="seat-booking.html">Book a seat</a></header>
      <div id="bookingsView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_bookings as bk, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('studentNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('studentLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'student';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('my-bookings.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const list = bk.bookingsForUser(u.id).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      const el = document.getElementById('bookingsView');
      if(list.length === 0){ el.innerHTML = '<div class="empty-state"><h3>No bookings</h3><p>Book a seat to see it here.</p></div>'; return; }
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Seat</th><th>Date</th><th>Time</th><th>Amount</th><th>Status</th><th>Approval</th><th>Action</th></tr></thead><tbody>${list.map(bkng => {
        const [st, en] = [bkng.startTime, bkng.endTime];
        return `<tr><td>${bkng.seatLabel}</td><td>${f.dateShort(bkng.date)}</td><td>${st} – ${en}</td><td>${f.currency(bkng.amount)}</td><td><span class="tag ${f.statusClass(bkng.status)}">${f.statusLabel(bkng.status)}</span></td><td><span class="tag ${f.statusClass(bkng.approvalStatus)}">${f.statusLabel(bkng.approvalStatus)}</span></td><td>`;
        if(bkng.status === 'pending' && bkng.approvalStatus === 'pending'){
          return `<button class="btn danger sm" onclick="cancel('${bkng.id}')">Cancel</button>`;
        }
        if(bkng.approvalStatus === 'approved'){
          return `<span class="tag ok">Active</span>`;
        }
        return `<span class="tag neu">—</span>`;
      }).join('')}</tbody></table></div>`;
    }
    window.cancel = (id) => {
      const u = auth.getCurrentUser();
      if(!confirm('Cancel this booking?')) return;
      const res = bk.cancelBooking(id, u.id);
      if(res.ok){ notify.success('Booking cancelled.'); render(); } else { notify.error(res.error || 'Cancel failed.'); }
    };
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['student'])) return;
    render();
  </script>
</body>
</html>
