<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description"content="SraswatiLibrary student dashboard.">
  <title>SraswatiLibrary — Student Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>

  <div class="dashboard">
    <div class="dashboard-demo-banner">
      <span>DEMO MODE — Frontend-only simulation</span>
      <a href="../index.html">View site</a>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Student Portal</div>
      <nav class="dashboard-nav" id="studentNav"></nav>
      <div class="dashboard-sidebar-footer">
        <button class="btn sec full" id="studentLogout" style="margin-top:var(--space-8)">Log out</button>
      </div>
    </aside>

    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar">
        <div>
          <div class="dashboard-title" id="pageTitle">Dashboard</div>
          <div class="page-subtitle">Your library overview</div>
        </div>
        <div class="dashboard-user" id="dashboardUser">
          <div class="dashboard-user-avatar" id="userAvatar">U</div>
          <div class="dashboard-user-info">
            <div class="dashboard-user-name" id="userName">—</div>
            <div class="dashboard-user-role">Student</div>
          </div>
        </div>
      </header>

      <div class="dashboard-stats" id="stats"></div>

      <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:var(--space-16);margin-bottom:var(--space-16)">
        <div class="card">
          <div class="card-header">
            <div class="dashboard-user-name" style="font-size:18px">Quick actions</div>
          </div>
          <div class="form-actions" style="gap:var(--space-8)">
            <a class="btn pri full" href="books.html">Browse books</a>
            <a class="btn sec full" href="seat-booking.html">Book a seat</a>
            <a class="btn sec full" href="book-loans.html">My loans</a>
            <a class="btn sec full" href="payments.html">Payments</a>
          </div>
        </div>
        <div class="card">
          <h3 style="font-family:var(--font-serif);margin-bottom:var(--space-10)">Notices</h3>
          <div id="notices"></div>
        </div>
      </section>

      <section class="card" style="margin-bottom:var(--space-16)">
        <h3 style="font-family:var(--font-serif);margin-bottom:var(--space-12)">Recently borrowed</h3>
        <div id="recentLoans"></div>
      </section>

      <section class="card">
        <h3 style="font-family:var(--font-serif);margin-bottom:var(--space-12)">Your next seat</h3>
        <div id="nextSeat"></div>
      </section>
    </div>
  </div>

  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_state as state, __sraswati_loans as loans, __sraswati_bookings as bookings, __sraswati_seats as seats, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';

    const navEl = document.getElementById('studentNav');
    const titleEl = document.getElementById('pageTitle');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const statsEl = document.getElementById('stats');
    const logoutBtn = document.getElementById('studentLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');

    const role = 'student';
    const items = perms.navItemsForRole(role);
    navEl.innerHTML = items.map(i => `
      <a href="${i.href}" class="${i.href.endsWith('dashboard.html')?'active':''}" data-perm="${i.perm || ''}">${i.icon || '•'} ${i.label}</a>
    `).join('');

    function render() {
      const u = auth.getCurrentUser();
      if (!u) return;
      userName.textContent = u.name;
      userAvatar.textContent = u.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

      const activeLoans = loans.activeLoansForUser(u.id);
      const myBookings = bookings.bookingsForUser(u.id);
      const outstanding = app.fines ? app.fines.outstandingForUser(u.id) : 0;

      statsEl.innerHTML = `
        <div class="dashboard-stat">
          <div class="stat">${activeLoans.length}</div>
          <div class="stat-label">Books on loan</div>
        </div>
        <div class="dashboard-stat">
          <div class="stat">${myBookings.filter(b => b.status === 'booked').length}</div>
          <div class="stat-label">Active seat bookings</div>
        </div>
        <div class="dashboard-stat">
          <div class="stat">${f.currency(outstanding)}</div>
          <div class="stat-label">Outstanding fines</div>
        </div>
        <div class="dashboard-stat">
          <div class="stat">${myBookings.filter(b => b.status === 'pending').length}</div>
          <div class="stat-label">Pending payments</div>
        </div>
      `;
    }

    logoutBtn.addEventListener('click', (e) => {
      e.preventDefault();
      auth.logout();
      notify.success('Logged out.');
      setTimeout(() => { window.location.href = '../login.html'; }, 600);
    });

    mobileBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });

    if (!app.requireRole(['student'])) return;
    render();
    state.subscribe(render);
  </script>
</body>
</html>
