<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Book Loans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Student Portal · Loans</div>
      <nav class="dashboard-nav" id="studentNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="studentLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Book loans</div><div class="page-subtitle">Current loans, due dates, renewals</div></div><a class="btn sec" href="books.html">Browse catalogue</a></header>
      <div id="loansView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_loans as l, __sraswati_books as b, __sraswati_fines as fn, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('studentNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('studentLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'student';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('book-loans.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const active = l.activeLoansForUser(u.id);
      const hist = l.allLoansForUser(u.id).filter(x => x.status !== 'active');
      const el = document.getElementById('loansView');
      let html = '';
      if(active.length){
        html += `<h3 style="font-family:var(--font-serif);margin-bottom:var(--space-10)">On loan (${active.length})</h3><div class="table-wrap"><table><thead><tr><th>Book</th><th>Author</th><th>Borrowed</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
        active.forEach(loan => {
          const book = b.findBook(loan.bookId);
          const due = new Date(loan.dueAt); const now = new Date();
          const overdue = now > due;
          html += `<tr><td>${book ? book.title : '—'}</td><td>${book ? book.author : '—'}</td><td>${f.dateShort(loan.issuedAt)}</td><td><span class="tag ${overdue?'bad':'ok'}">${f.dateShort(loan.dueAt)}</span></td><td><span class="tag ${overdue?'bad':'ok'}">${overdue?'Overdue':'Active'}</span></td><td>`;
          if(!overdue && loan.renewedCount < 2) html += `<button class="btn pri sm" onclick="renew('${loan.id}')">Renew</button>`;
          else if(overdue) html += `<a class="btn pri sm" href="fines.html">Pay fine</a>`;
          html += `</td></tr>`;
        });
        html += '</tbody></table></div>';
      } else {
        html += '<div class="empty-state"><h3>No books on loan</h3><p>Browse the catalogue to borrow a book.</p></div>';
      }
      if(hist.length){
        html += `<h3 style="font-family:var(--font-serif);margin:var(--space-20) 0 var(--space-10)">History</h3><div class="table-wrap"><table><thead><tr><th>Book</th><th>Author</th><th>Returned</th><th>Status</th></tr></thead><tbody>`;
        hist.forEach(loan => {
          const book = b.findBook(loan.bookId);
          html += `<tr><td>${book ? book.title : '—'}</td><td>${book ? book.author : '—'}</td><td>${f.dateShort(loan.returnedAt)}</td><td><span class="tag ok">Returned</span></td></tr>`;
        });
        html += '</tbody></table></div>';
      }
      el.innerHTML = html;
      window.renew = (id) => {
        const res = l.renewLoan(id);
        if(res.ok){ notify.success(`Renewed. Due ${f.dateShort(res.loan.dueAt)}.`); render(); } else { notify.error(res.error); }
      };
    }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['student'])) return;
    render();
  </script>
</body>
</html>
