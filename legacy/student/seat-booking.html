<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Seat Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Student Portal · Seat booking</div>
      <nav class="dashboard-nav" id="studentNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="studentLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Book a seat</div><div class="page-subtitle">Select date, time slot, and seat</div></div></header>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:var(--space-16)">
        <section class="card">
          <div class="dashboard-user-name" style="font-size:16px;margin-bottom:var(--space-10)">1. Choose date &amp; time</div>
          <div class="form-grid">
            <div class="field"><label class="lbl">Date</label><input type="date" id="seatDate" class="input" required></div>
            <div class="field"><label class="lbl">Time slot</label><select id="seatSlot" class="input"><option>9:00 – 12:00</option><option>12:00 – 15:00</option><option>15:00 – 18:00</option><option>18:00 – 21:00</option></select></div>
          </div>
        </section>
        <section class="card">
          <div class="dashboard-user-name" style="font-size:16px;margin-bottom:var(--space-10)">2. Choose a zone</div>
          <div id="zonesView"></div>
        </section>
        <section class="card">
          <div class="dashboard-user-name" style="font-size:16px;margin-bottom:var(--space-10)">3. Available seats</div>
          <div id="seatsView"></div>
        </section>
        <section class="card">
          <div class="dashboard-user-name" style="font-size:16px;margin-bottom:var(--space-10)">4. Summary &amp; confirm</div>
          <div id="summaryView"></div>
        </section>
      </div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_seats as s, __sraswati_bookings as bk, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('studentNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('studentLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'student';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('seat-booking.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    let sel = { seat: null, date: '', slot: '' };
    const slots = ['9:00 – 12:00','12:00 – 15:00','15:00 – 18:00','18:00 – 21:00'];
    function timeRange(slot){
      const m = { '9:00 – 12:00':['09:00','12:00'], '12:00 – 15:00':['12:00','15:00'], '15:00 – 18:00':['15:00','18:00'], '18:00 – 21:00':['18:00','21:00'] };
      return m[slot] || ['09:00','12:00'];
    }
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const dateEl = document.getElementById('seatDate');
      const today = new Date().toISOString().slice(0,10);
      dateEl.min = today;
      if(!dateEl.value) dateEl.value = today;
      sel.date = dateEl.value;
      sel.slot = document.getElementById('seatSlot').value;
      const [startT, endT] = timeRange(sel.slot);
      const zones = s.allZones();
      document.getElementById('zonesView').innerHTML = zones.map(z => `<div style="margin-bottom:var(--space-8)"><div class="dashboard-user-name" style="font-size:14px">${z.name}</div>${s.seatsByZone(z.id).filter(se => !se.archived).map(se => {
        const avail = bk.isSeatAvailable(se.id, sel.date, startT, endT);
        const cls = avail ? 'chip' : 'chip' + (se.status !== 'available' ? '' : '');
        return `<button class="${avail && se.status==='available'?'chip on':'chip'}" onclick="pickSeat('${se.id}','${se.seatId}')" ${!avail || se.status !== 'available' ? 'disabled' : ''}>${se.seatId} (${se.kind})${se.accessible?' ♿':''}</button>`;
      }).join('')}</div>`).join('');
      document.getElementById('seatsView').innerHTML = sel.seat ? `<p>Selected: <strong>${sel.seatLabel}</strong></p><button class="btn sec sm" onclick="sel.seat=null;render()">Change</button>` : `<div class="empty-state"><p>No seat selected. Pick a seat above.</p></div>`;
      document.getElementById('summaryView').innerHTML = sel.seat ? `
        <div style="border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-12)">
          <p style="color:var(--text-label);font-size:12px;margin-bottom:var(--space-6)">Amount</p>
          <div class="stat" style="font-size:20px">₹30</div>
          <p style="color:var(--text-muted);font-size:13px;margin-top:var(--space-6);margin-bottom:var(--space-10)">Seat ${sel.seatLabel} · ${sel.date} · ${sel.slot}</p>
          <button class="btn pri full" onclick="confirmBooking()">Proceed to payment</button>
        </div>
      ` : `<div class="empty-state"><p>Select a seat to see the price.</p></div>`;
    }
    window.pickSeat = (id, label) => { sel.seat = id; sel.seatLabel = label; render(); };
    window.confirmBooking = () => {
      if(!sel.seat){ notify.error('Please select a seat.'); return; }
      const u = auth.getCurrentUser();
      const [startT, endT] = timeRange(sel.slot);
      const res = bk.createBooking({ userId: u.id, seatId: sel.seat, seatLabel: sel.seatLabel, date: sel.date, startTime: startT, endTime: endT, amount: 30, paymentMethod: 'razorpay' });
      if(res.ok){ notify.success(`Booking created for ${sel.seatLabel}. Payment pending approval.`); sel = { seat: null, date: '', slot: '' }; render(); }
      else { notify.error(res.error || 'Booking failed.'); }
    };
    document.getElementById('seatDate').addEventListener('change', render);
    document.getElementById('seatSlot').addEventListener('change', render);
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['student'])) return;
    render();
  </script>
</body>
</html>
