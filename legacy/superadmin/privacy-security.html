<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Privacy & Security</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Superadmin · Privacy &amp; Security</div>
      <nav class="dashboard-nav" id="saNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="saLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Privacy &amp; Security</div><div class="page-subtitle">Consent, cookies, and security posture</div></div></header>
      <div id="privView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_settings as settings, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('saNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('saLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'superadmin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('privacy-security.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const s = settings.all ? settings.all() : window.__sraswati_storage.readCollection('settings', {});
      const cc = s.cookieConsent || { essential:true, analytics:false, marketing:false };
      const terms = window.__sraswati_storage.readCollection('terms', {});
      const privacy = window.__sraswati_storage.readCollection('privacy', {});
      const el = document.getElementById('privView');
      el.innerHTML = `
        <div class="card" style="max-width:700px;margin-top:var(--space-12)">
          <div class="dashboard-user-name" style="font-size:18px;margin-bottom:var(--space-12)">Cookie consent (demo)</div>
          <form id="privForm" novalidate>
            <div style="display:flex;align-items:center;gap:var(--space-10);margin-bottom:var(--space-10)"><input type="checkbox" id="ccEss" ${cc.essential?'checked':''} disabled><label style="cursor:default">Essential cookies (required)</label></div>
            <div style="display:flex;align-items:center;gap:var(--space-10);margin-bottom:var(--space-10)"><input type="checkbox" id="ccAna" ${cc.analytics?'checked':''}><label>Analytics cookies</label></div>
            <div style="display:flex;align-items:center;gap:var(--space-10);margin-bottom:var(--space-16)"><input type="checkbox" id="ccMkt" ${cc.marketing?'checked':''}><label>Marketing cookies</label></div>
            <div class="form-actions"><button type="submit" class="btn pri full">Save consent</button></div>
          </form>
        </div>
        <div class="card" style="max-width:700px;margin-top:var(--space-12)">
          <div class="dashboard-user-name" style="font-size:16px;margin-bottom:var(--space-10)">Policy versions</div>
          <div style="display:flex;gap:var(--space-12);font-size:12px;color:var(--text-muted)"><div>Terms v${terms.version||'1.0'}</div><div>Privacy v${privacy.version||'1.0'}</div></div>
          <p style="color:var(--text-muted);font-size:12px;margin-top:var(--space-8)">Production deployments require server-side consent logging and a privacy officer review.</p>
        </div>`;
      document.getElementById('privForm').onsubmit = (e)=>{
        e.preventDefault();
        const cur = settings.all ? settings.all() : window.__sraswati_storage.readCollection('settings', {});
        cur.cookieConsent = { essential:true, analytics:document.getElementById('ccAna').checked, marketing:document.getElementById('ccMkt').checked, updatedAt:new Date().toISOString() };
        const res = settings.save ? settings.save(cur) : (window.__sraswati_storage.writeCollection('settings', cur), { ok:true });
        if(res.ok){ notify.success('Consent saved.'); render(); }
        else { notify.error(res.error||'Failed.'); }
      };
    }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['superadmin'])) return;
    render();
  </script>
</body>
</html>
