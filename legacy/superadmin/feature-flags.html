<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Feature Flags</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Superadmin · Feature Flags</div>
      <nav class="dashboard-nav" id="saNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="saLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Feature Flags</div><div class="page-subtitle">Toggle experimental features (demo)</div></div></header>
      <div id="ffView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_settings as settings, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('saNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('saLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'superadmin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('feature-flags.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    const FLAGS = [
      { key:'razorpayLive', label:'Razorpay live mode', desc:'Use live Razorpay environment (requires real keys)' },
      { key:'autoApproveRazorpay', label:'Auto-approve Razorpay payments', desc:'Skip manual approval for gateway-captured payments' },
      { key:'approvalRequiredForPayments', label:'Require payment approval', desc:'All non-instant payments need admin review' },
      { key:'enableOnlinePayments', label:'Online payments enabled', desc:'Allow Razorpay checkout on student portal' },
    ];
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const s = settings.all ? settings.all() : window.__sraswati_storage.readCollection('settings', {});
      const el = document.getElementById('ffView');
      el.innerHTML = `<div class="permission-grid">${FLAGS.map(fl => {
        const val = s[fl.key] === true;
        return `<div class="permission-item"><input type="checkbox" id="ff_${fl.key}" ${val?'checked':''}><span class="permission-label">${fl.label}</span><div class="permission-desc">${fl.desc}</div></div>`;
      }).join('')}</div>`;
      FLAGS.forEach(fl => {
        document.getElementById('ff_'+fl.key).addEventListener('change', (e)=>{
          const cur = settings.all ? settings.all() : window.__sraswati_storage.readCollection('settings', {});
          cur[fl.key] = e.target.checked === true;
          cur.updatedAt = new Date().toISOString();
          const res = settings.save ? settings.save(cur) : (window.__sraswati_storage.writeCollection('settings', cur), { ok:true });
          if(res.ok) notify.success(`${fl.label} ${e.target.checked?'enabled':'disabled'}.`);
          else { notify.error(res.error||'Failed.'); e.target.checked = !e.target.checked; }
        });
      });
    }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['superadmin'])) return;
    render();
  </script>
</body>
</html>
