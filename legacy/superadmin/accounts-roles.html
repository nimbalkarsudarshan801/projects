<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Accounts & Roles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Superadmin · Accounts &amp; Roles</div>
      <nav class="dashboard-nav" id="saNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="saLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Accounts &amp; Roles</div><div class="page-subtitle">Manage user accounts and role definitions</div></div><a class="btn pri" href="#" onclick="openForm()">Create account</a></header>
      <div id="accView"></div>
      <div id="roleView"></div>
      <div id="formWrap" style="display:none"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_members as mem, __sraswati_permissions as perms, __sraswati_notifications as notify, __sraswati_formatters as f } from '../js/app.js';
    const navEl = document.getElementById('saNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('saLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'superadmin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('accounts-roles.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const users = mem.allUsers();
      const roles = perms.ROLES;
      document.getElementById('accView').innerHTML = `<div class="dashboard-user-name" style="font-size:16px;margin-bottom:var(--space-10)">Accounts (${users.length})</div><div class="table-wrap"><table><thead><tr><th>Avatar</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${users.map(user => {
        return `<tr><td><div class="dashboard-user-avatar" style="width:28px;height:28px;font-size:11px">${user.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)}</div></td><td><div class="dashboard-user-name" style="font-size:13px">${user.name}</div></td><td style="color:var(--text-muted);font-size:12px">${user.email}</td><td><span class="tag ${user.role==='superadmin'?'bad':user.role==='admin'?'warn':'ok'}">${user.role}</span></td><td><span class="tag ${user.status==='active'?'ok':'bad'}">${user.status}</span></td><td style="color:var(--text-muted);font-size:12px">${f.dateShort(user.createdAt)}</td><td><button class="btn sec sm" onclick="setStatus('${user.id}','${user.status==='active'?'disabled':'active'}')" style="padding:4px 8px">${user.status==='active'?'Disable':'Enable'}</button></td></tr>`;
      }).join('')}</tbody></table></div>`;
      document.getElementById('roleView').innerHTML = `<div class="dashboard-user-name" style="font-size:16px;margin:var(--space-16) 0 var(--space-10)">Roles</div><div class="permission-grid">${Object.entries(roles).map(([id,name]) => `<div class="permission-item"><span class="permission-label">${name}</span><span class="tag neu">${perms.permissionsForRole(id).length} perms</span></div>`).join('')}</div>`;
    }
    window.setStatus = (id,status) => { const r = mem.setUserStatus(id,status); if(r.ok){ notify.success(`Account ${status}.`); render(); } else { notify.error(r.error); } };
    function openForm(){
      const wrap = document.getElementById('formWrap');
      wrap.style.display='block';
      wrap.innerHTML = `
        <div class="card" style="max-width:520px;margin-top:var(--space-12)">
          <div class="dashboard-user-name" style="font-size:18px;margin-bottom:var(--space-12)">Create account</div>
          <form id="accForm" novalidate>
            <div class="field"><label class="lbl">Full name</label><input type="text" id="anName" class="input" required></div>
            <div class="field"><label class="lbl">Email</label><input type="email" id="anEmail" class="input" required></div>
            <div class="field"><label class="lbl">Role</label><select id="anRole" class="input"><option value="student">Student</option><option value="librarian">Librarian</option><option value="admin">Admin</option><option value="superadmin">Superadmin</option></select></div>
            <div class="field"><label class="lbl">Demo password</label><input type="password" id="anPassword" class="input" value="demo1234"></div>
            <div class="field-error" id="anErr" style="margin-bottom:var(--space-10)"></div>
            <div class="form-actions"><button type="button" class="btn sec" onclick="document.getElementById('formWrap').style.display='none'">Cancel</button><button type="submit" class="btn pri full">Create</button></div>
          </form>
        </div>`;
      document.getElementById('accForm').onsubmit = (e)=>{
        e.preventDefault(); document.getElementById('anErr').textContent='';
        const res = mem.createUser({ name:document.getElementById('anName').value.trim(), email:document.getElementById('anEmail').value.trim(), role:document.getElementById('anRole').value, status:'active', password:document.getElementById('anPassword').value||'demo1234' });
        if(res.ok){ notify.success('Account created.'); document.getElementById('formWrap').style.display='none'; render(); }
        else { document.getElementById('anErr').textContent = res.error||'Failed.'; }
      };
    }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['superadmin'])) return;
    render();
  </script>
</body>
</html>
