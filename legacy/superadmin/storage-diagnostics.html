<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Storage Diagnostics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Superadmin · Storage Diagnostics</div>
      <nav class="dashboard-nav" id="saNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="saLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Storage Diagnostics</div><div class="page-subtitle">localStorage collections and maintenance</div></div></header>
      <div id="stView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_storage as storage, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('saNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('saLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'superadmin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('storage-diagnostics.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const collections = ['users','roles','permissions','books','copies','categories','loans','reservations','seats','bookings','memberships','membershipPlans','payments','paymentApprovals','fines','sessions','notifications','auditLogs','settings','terms','consent'];
      const el = document.getElementById('stView');
      el.innerHTML = `<div class="dashboard-user-name" style="font-size:16px;margin-bottom:var(--space-10)">Collections</div><div class="table-wrap"><table><thead><tr><th>Collection</th><th>Records</th><th>Est. size</th><th>Action</th></tr></thead><tbody>${collections.map(c => {
        const data = storage.readCollection(c, []);
        const size = new Blob([JSON.stringify(data)]).size;
        return `<tr><td style="font-size:12px">${c}</td><td style="font-size:12px">${data.length}</td><td style="font-size:12px">${(size/1024).toFixed(1)} KB</td><td style="font-size:12px"><button class="btn sec sm" onclick="clearCol('${c}')" style="padding:4px 8px">Clear</button></td></tr>`;
      }).join('')}</tbody></table></div>`;
      let used = 0; try { for(const k in localStorage){ if(localStorage.hasOwnProperty(k)) used += localStorage[k].length + k.length; } } catch(e){}
      el.innerHTML += `<div style="margin-top:var(--space-16)"><div class="dashboard-user-name" style="font-size:14px">localStorage usage</div><div style="font-size:12px;color:var(--text-muted)">Approx ${(used/1024).toFixed(1)} KB used</div><div style="margin-top:var(--space-10)"><button class="btn danger" onclick="clearAll()">Reset all demo data (seed on reload)</button></div></div>`;
    }
    window.clearCol = (c) => { if(!confirm(`Clear ${c}?`)) return; storage.writeCollection(c, []); notify.success(`${c} cleared.`); render(); };
    window.clearAll = () => { if(!confirm('Reset ALL demo data? This cannot be undone.')) return; localStorage.clear(); sessionStorage.clear(); notify.success('Storage cleared. Reload to reseed.'); };
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['superadmin'])) return;
    render();
  </script>
</body>
</html>
