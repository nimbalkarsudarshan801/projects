<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Membership Plans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Admin · Membership Plans</div>
      <nav class="dashboard-nav" id="adminNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="adminLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Membership Plans</div><div class="page-subtitle">Subscription plans and pricing</div></div></header>
      <div id="plansView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_memberships as mp, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('adminNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('adminLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'admin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('membership-plans.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const plans = mp.allPlans ? mp.allPlans() : window.__sraswati_storage.readCollection('membershipPlans', []);
      const el = document.getElementById('plansView');
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Plan</th><th>Duration</th><th>Price</th><th>Borrow limit</th><th>Active</th><th>Actions</th></tr></thead><tbody>${plans.map(p => `
      <tr><td><div class="dashboard-user-name" style="font-size:13px">${p.name}</div></td><td style="font-size:12px">${p.durationDays} days</td><td style="font-size:12px">${f.currency(p.price)}</td><td style="font-size:12px">${p.borrowLimit} books</td><td><span class="tag ${p.active?'ok':'bad'}">${p.active?'Yes':'No'}</span></td><td><button class="btn sec sm" onclick="toggle('${p.id}')" style="padding:4px 8px">${p.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div>`;
    }
    window.toggle = (id) => { const p = window.__sraswati_storage.readCollection('membershipPlans', []).find(x=>x.id===id); if(!p) return; p.active = !p.active; const plans = window.__sraswati_storage.readCollection('membershipPlans', []).map(x=>x.id===id?p:x); window.__sraswati_storage.writeCollection('membershipPlans', plans); notify.success(`Plan ${p.active?'activated':'deactivated'}.`); render(); };
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['admin','superadmin'])) return;
    render();
  </script>
</body>
</html>
