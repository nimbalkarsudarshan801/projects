<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Fines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Admin · Fines</div>
      <nav class="dashboard-nav" id="adminNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="adminLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Fines</div><div class="page-subtitle">Late fees, waivers, and adjustments</div></div></header>
      <div id="finesView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_fines as fn, __sraswati_members as mem, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('adminNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('adminLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'admin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('fines.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const list = fn.allFines().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      const totalOutstanding = list.filter(f=>f.status!=='paid').reduce((s,f)=>s+(f.amount||0),0);
      const el = document.getElementById('finesView');
      el.innerHTML = `<div style="display:flex;gap:var(--space-12);margin-bottom:var(--space-12)"><div class="dashboard-stat"><div class="stat-label">Outstanding</div><div class="stat bad">${f.currency(totalOutstanding)}</div></div><div class="dashboard-stat"><div class="stat-label">Total fines</div><div class="stat">${list.length}</div></div></div><div class="table-wrap"><table><thead><tr><th>Reason</th><th>User</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>${list.map(fine => {
        const user = mem.findUser(fine.userId);
        return `<tr><td style="font-size:12px">${fine.reason}</td><td style="font-size:12px">${user?user.name:'—'}</td><td style="font-size:12px">${f.currency(fine.amount)}</td><td><span class="tag ${fine.status==='paid'?'ok':fine.status==='waived'?'neu':'bad'}">${fine.status}</span></td><td style="font-size:12px">${f.dateShort(fine.createdAt)}</td><td>`;
        if(fine.status==='unpaid'){
          return `<button class="btn pri sm" onclick="pay('${fine.id}')" style="padding:4px 8px">Pay</button> <button class="btn sec sm" onclick="waive('${fine.id}')" style="padding:4px 8px">Waive</button>`;
        }
        return `<span class="tag neu">—</span>`;
      }).join('')}</tbody></table></div>`;
    }
    window.pay = (id) => { const r = fn.payFine(id, 'system', auth.getCurrentUser().id); if(r.ok){ notify.success('Fine marked paid.'); render(); } else { notify.error(r.error); } };
    window.waive = (id) => { const reason = prompt('Waiver reason:'); if(reason===null) return; const r = fn.waiveFine(id, auth.getCurrentUser().id, reason); if(r.ok){ notify.success('Fine waived.'); render(); } else { notify.error(r.error); } };
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['admin','superadmin','librarian'])) return;
    render();
  </script>
</body>
</html>
