<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Admin · Catalogue</div>
      <nav class="dashboard-nav" id="adminNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="adminLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Catalogue</div><div class="page-subtitle">Books, categories, and inventory</div></div><a class="btn pri" href="#" onclick="openBookForm()">Add book</a></header>
      <div id="catalogueView"></div>
      <div id="bookFormWrap" style="display:none"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_books as bk, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('adminNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('adminLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'admin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('catalogue.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    let editingId = null;
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const books = bk.allBooks().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      const el = document.getElementById('catalogueView');
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-10);margin-bottom:var(--space-12)">
          <div><div class="dashboard-user-name" style="font-size:14px;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em">Books (${books.length})</div></div>
          <input type="text" id="catFilter" placeholder="Search title, author, ISBN" class="input" style="width:min(320px,100%)">
        </div>
        <div class="table-wrap"><table><thead><tr><th>Cover</th><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Inventory</th><th>Status</th><th>Actions</th></tr></thead><tbody>${books.map(book => {
        const inv = bk.inventoryForBook(book.id);
        return `<tr><td><div class="book-cover" style="width:40px;height:54px;font-size:9px">${book.title.slice(0,2)}</div></td><td><div class="dashboard-user-name" style="font-size:13px">${book.title}</div></td><td style="color:var(--text-muted);font-size:12px">${book.author}</td><td style="color:var(--text-muted);font-size:12px">${book.isbn||'—'}</td><td style="color:var(--text-muted);font-size:12px">${book.category}</td><td style="font-size:12px">${inv.available}/${inv.total} avail<span style="color:var(--text-muted)"> · ${inv.issued} issued · ${inv.damaged} dmg</span></td><td><span class="tag ${book.archived?'bad':'ok'}">${book.archived?'Archived':'Active'}</span></td><td>
          <button class="btn pri sm" onclick="openBookForm('${book.id}')" style="padding:4px 8px;font-size:12px">Edit</button>
          ${book.archived?`<button class="btn sec sm" onclick="archive('${book.id}',false)" style="padding:4px 8px;font-size:12px">Restore</button>`:`<button class="btn danger sm" onclick="archive('${book.id}',true)" style="padding:4px 8px;font-size:12px">Archive</button>`}
        </td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    function openBookForm(id){
      editingId = id;
      const wrap = document.getElementById('bookFormWrap');
      const book = id ? bk.findBook(id) : null;
      const cats = bk.allCategories();
      wrap.style.display = 'block';
      wrap.innerHTML = `
        <div class="card" style="max-width:560px;margin-top:var(--space-12)">
          <div class="dashboard-user-name" style="font-size:18px;margin-bottom:var(--space-12)">${id?'Edit book':'Add book'}</div>
          <form id="bookSaveForm" novalidate>
            <div class="field"><label class="lbl">Title</label><input type="text" id="bkTitle" class="input" value="${book?book.title:''}" required></div>
            <div class="field"><label class="lbl">Author</label><input type="text" id="bkAuthor" class="input" value="${book?book.author:''}" required></div>
            <div class="field"><label class="lbl">ISBN</label><input type="text" id="bkIsbn" class="input" value="${book?book.isbn||'':''}"></div>
            <div class="field"><label class="lbl">Category</label><select id="bkCat" class="input">${cats.map(c=>`<option value="${c.name}" ${book&&book.category===c.name?'selected':''}>${c.name}</option>`).join('')}</select></div>
            <div class="field"><label class="lbl">Publisher</label><input type="text" id="bkPub" class="input" value="${book?book.publisher||'':''}"></div>
            <div class="field"><label class="lbl">Total copies</label><input type="number" id="bkCopies" class="input" value="${book?book.totalCopies:1}" min="1"></div>
            <div class="field"><label class="lbl">Edition</label><input type="text" id="bkEdition" class="input" value="${book?book.edition:'1st'}"></div>
            <div class="field"><label class="lbl">Published year</label><input type="text" id="bkYear" class="input" value="${book?book.publishedYear||'':''}"></div>
            <div class="field-error" id="bkErr" style="margin-bottom:var(--space-10)"></div>
            <div class="form-actions"><button type="button" class="btn sec" onclick="closeBookForm()">Cancel</button><button type="submit" class="btn pri full">Save</button></div>
          </form>
        </div>`;
      document.getElementById('bookSaveForm').onsubmit = (e)=>{
        e.preventDefault(); document.getElementById('bkErr').textContent='';
        const data = { title:document.getElementById('bkTitle').value.trim(), author:document.getElementById('bkAuthor').value.trim(), isbn:document.getElementById('bkIsbn').value.trim(), category:document.getElementById('bkCat').value, publisher:document.getElementById('bkPub').value.trim(), totalCopies:document.getElementById('bkCopies').value, edition:document.getElementById('bkEdition').value.trim()||'1st', publishedYear:document.getElementById('bkYear').value.trim() };
        const res = id ? bk.updateBook(id,data) : bk.createBook(data);
        if(res.ok){ notify.success(id?'Book updated.':'Book created.'); closeBookForm(); render(); }
        else { document.getElementById('bkErr').textContent = res.error||'Failed.'; }
      };
    }
    window.openBookForm = openBookForm;
    window.closeBookForm = () => { document.getElementById('bookFormWrap').style.display='none'; editingId=null; };
    window.archive = (id,arch) => { const res = bk.archiveBook(id); if(res.ok){ notify.success(arch?'Archived.':'Restored.'); render(); } else { notify.error(res.error); } };
    document.getElementById('catFilter').addEventListener('input',(e)=>{
      const term = e.target.value.toLowerCase();
      const rows = document.querySelectorAll('#catalogueView tbody tr');
      rows.forEach(r=>{ r.style.display = r.textContent.toLowerCase().includes(term)?'':'none'; });
    });
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['admin','superadmin','librarian'])) return;
    render();
  </script>
</body>
</html>
