<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Admin · Reports</div>
      <nav class="dashboard-nav" id="adminNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="adminLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Reports</div><div class="page-subtitle">Library activity and export</div></div></header>
      <div id="reportsView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_loans as ln, __sraswati_payments as pay, __sraswati_bookings as bkg, __sraswati_members as mem, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('adminNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('adminLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'admin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('reports.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const loans = ln.allLoans(); const payments = pay.allPayments(); const bookings = bkg.allBookings(); const users = mem.allUsers();
      const overdue = ln.overdueLoans ? ln.overdueLoans().length : 0;
      const totalPaid = payments.filter(p=>p.status==='captured').reduce((s,p)=>s+(p.amount||0),0);
      const el = document.getElementById('reportsView');
      el.innerHTML = `
        <div class="dashboard-stats">
          <div class="dashboard-stat"><div class="stat-label">Total users</div><div class="stat">${users.length}</div></div>
          <div class="dashboard-stat"><div class="stat-label">Total loans</div><div class="stat">${loans.length}</div></div>
          <div class="dashboard-stat"><div class="stat-label">Overdue loans</div><div class="stat bad">${overdue}</div></div>
          <div class="dashboard-stat"><div class="stat-label">Total bookings</div><div class="stat">${bookings.length}</div></div>
          <div class="dashboard-stat"><div class="stat-label">Revenue (captured)</div><div class="stat">${f.currency(totalPaid)}</div></div>
        </div>
        <div style="margin-top:var(--space-16)"><div class="dashboard-user-name" style="font-size:16px">Export</div><div style="margin-top:var(--space-10)"><button class="btn pri" onclick="exportLoans()">Export loans (CSV)</button> <button class="btn sec" onclick="exportPayments()">Export payments (CSV)</button></div></div>`;
    }
    window.exportLoans = () => { const csv = pay.csvExport(ln.allLoans().map(l=>({ id:l.id, userId:l.userId, bookId:l.bookId, issuedAt:l.issuedAt, dueAt:l.dueAt, status:l.status }))); download('sraswati-loans.csv',csv); };
    window.exportPayments = () => { const csv = pay.csvExport(pay.allPayments()); download('sraswati-payments.csv',csv); };
    function download(name, content){ const blob = new Blob([content],{type:'text/csv'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); notify.success(`Exported ${name}.`); }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['admin','superadmin','librarian'])) return;
    render();
  </script>
</body>
</html>
