<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Admin · Bookings</div>
      <nav class="dashboard-nav" id="adminNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="adminLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Bookings</div><div class="page-subtitle">Seat booking approvals and history</div></div></header>
      <div id="bookingsView"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_bookings as bkg, __sraswati_members as mem, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('adminNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('adminLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'admin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('bookings.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const list = bkg.allBookings().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      const el = document.getElementById('bookingsView');
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Seat</th><th>User</th><th>Date</th><th>Time</th><th>Amount</th><th>Status</th><th>Approval</th><th>Actions</th></tr></thead><tbody>${list.map(b => {
        const user = mem.findUser(b.userId);
        return `<tr><td><div class="dashboard-user-name" style="font-size:12px">${b.seatLabel}</div></td><td style="font-size:12px">${user?user.name:'—'}</td><td style="font-size:12px">${f.dateShort(b.date)}</td><td style="font-size:12px">${b.startTime} – ${b.endTime}</td><td style="font-size:12px">${f.currency(b.amount)}</td><td><span class="tag ${f.statusClass(b.status)}">${f.statusLabel(b.status)}</span></td><td><span class="tag ${f.statusClass(b.approvalStatus)}">${f.statusLabel(b.approvalStatus)}</span></td><td>`;
        if(b.approvalStatus==='pending'){
          return `<button class="btn pri sm" onclick="appr('${b.id}')" style="padding:4px 8px">Approve</button><button class="btn danger sm" onclick="rej('${b.id}')" style="padding:4px 8px;margin-left:4px">Reject</button>`;
        }
        if(b.approvalStatus==='approved') return `<span class="tag ok">Active</span>`;
        return `<span class="tag neu">Rejected</span>`;
      }).join('')}</tbody></table></div>`;
    }
    window.appr = (id) => { const r = bkg.approveBooking(id, auth.getCurrentUser().id, 'Approved via demo admin'); if(r.ok){ notify.success('Booking approved.'); render(); } else { notify.error(r.error); } };
    window.rej = (id) => { const reason = prompt('Rejection reason:'); if(reason===null) return; const r = bkg.rejectBooking(id, auth.getCurrentUser().id, reason); if(r.ok){ notify.success('Booking rejected.'); render(); } else { notify.error(r.error); } };
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['admin','superadmin','librarian'])) return;
    render();
  </script>
</body>
</html>
