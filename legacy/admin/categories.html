<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Admin · Categories</div>
      <nav class="dashboard-nav" id="adminNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="adminLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Categories</div><div class="page-subtitle">Book categories</div></div><a class="btn pri" href="#" onclick="openForm()">Add category</a></header>
      <div id="catView"></div>
      <div id="formWrap" style="display:none"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_books as bk, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('adminNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('adminLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'admin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('categories.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const list = bk.allCategories().sort((a,b)=> a.name.localeCompare(b.name));
      const el = document.getElementById('catView');
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Category</th><th>Books</th><th>Created</th><th>Actions</th></tr></thead><tbody>${list.map(c => {
        const bookCount = bk.allBooks().filter(b=>b.category===c.name).length;
        return `<tr><td><div class="dashboard-user-name" style="font-size:13px">${c.name}</div></td><td style="font-size:12px">${bookCount}</td><td style="color:var(--text-muted);font-size:12px">${f.dateShort(c.createdAt)}</td><td><button class="btn danger sm" onclick="del('${c.id}')" style="padding:4px 8px">Delete</button></td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    window.del = (id) => { if(!confirm('Delete this category?')) return; const cats = window.__sraswati_storage.readCollection('categories', []).filter(c=>c.id!==id); window.__sraswati_storage.writeCollection('categories', cats); notify.success('Category deleted.'); render(); };
    function openForm(){
      const wrap = document.getElementById('formWrap');
      wrap.style.display='block';
      wrap.innerHTML = `
        <div class="card" style="max-width:520px;margin-top:var(--space-12)">
          <div class="dashboard-user-name" style="font-size:18px;margin-bottom:var(--space-12)">Add category</div>
          <form id="catForm" novalidate>
            <div class="field"><label class="lbl">Category name</label><input type="text" id="cnName" class="input" required></div>
            <div class="field-error" id="cnErr" style="margin-bottom:var(--space-10)"></div>
            <div class="form-actions"><button type="button" class="btn sec" onclick="document.getElementById('formWrap').style.display='none'">Cancel</button><button type="submit" class="btn pri full">Create</button></div>
          </form>
        </div>`;
      document.getElementById('catForm').onsubmit = (e)=>{
        e.preventDefault(); document.getElementById('cnErr').textContent='';
        const res = bk.createCategory({ name:document.getElementById('cnName').value.trim() });
        if(res.ok){ notify.success('Category created.'); document.getElementById('formWrap').style.display='none'; render(); }
        else { document.getElementById('cnErr').textContent = res.error||'Failed.'; }
      };
    }
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['admin','superadmin'])) return;
    render();
  </script>
</body>
</html>
