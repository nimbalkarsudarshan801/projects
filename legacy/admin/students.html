<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SraswatiLibrary — Students</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/modals.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>
  <div class="dashboard">
    <div class="dashboard-demo-banner"><span>DEMO MODE — Frontend-only simulation</span><a href="../index.html">View site</a></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="dashboard-sidebar" id="sidebar">
      <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
      <div class="sub">Admin · Students</div>
      <nav class="dashboard-nav" id="adminNav"></nav>
      <div class="dashboard-sidebar-footer"><button class="btn sec full" id="adminLogout" style="margin-top:var(--space-8)">Log out</button></div>
    </aside>
    <div class="dashboard-main">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">☰</button>
      <header class="dashboard-topbar"><div><div class="dashboard-title">Students</div><div class="page-subtitle">Student members</div></div><a class="btn pri" href="#" onclick="openForm()">Add student</a></header>
      <div id="stuView"></div>
      <div id="formWrap" style="display:none"></div>
    </div>
  </div>
  <script type="module">
    import { __sraswati_app as app, __sraswati_auth as auth, __sraswati_members as mem, __sraswati_notifications as notify, __sraswati_formatters as f, __sraswati_permissions as perms } from '../js/app.js';
    const navEl = document.getElementById('adminNav');
    const userName = document.getElementById('userName');
    const userAvatar = document.getElementById('userAvatar');
    const logoutBtn = document.getElementById('adminLogout');
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    const role = 'admin';
    navEl.innerHTML = perms.navItemsForRole(role).map(i => `<a href="${i.href}" class="${i.href.endsWith('students.html')?'active':''}">${i.icon||'•'} ${i.label}</a>`).join('');
    function render(){
      const u = auth.getCurrentUser(); if(!u)return;
      userName.textContent = u.name; userAvatar.textContent = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
      const list = mem.allStudents().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      const el = document.getElementById('stuView');
      el.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Avatar</th><th>Name</th><th>Email</th><th>Status</th><th>Membership</th><th>Created</th><th>Actions</th></tr></thead><tbody>${list.map(u => {
        const ms = window.__sraswati_storage.readCollection('memberships', []).filter(m=>m.userId===u.id && m.status==='active');
        return `<tr><td><div class="dashboard-user-avatar" style="width:28px;height:28px;font-size:11px">${u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)}</div></td><td><div class="dashboard-user-name" style="font-size:13px">${u.name}</div></td><td style="color:var(--text-muted);font-size:12px">${u.email}</td><td><span class="tag ${u.status==='active'?'ok':'bad'}">${u.status}</span></td><td>${ms.length?`<span class="tag ok">${ms[0].planName}</span>`:`<span class="tag neu">None</span>`}</td><td style="color:var(--text-muted);font-size:12px">${f.dateShort(u.createdAt)}</td><td>
          <button class="btn sec sm" onclick="setStatus('${u.id}', '${u.status==='active'?'disabled':'active'}')" style="padding:4px 8px">${u.status==='active'?'Disable':'Enable'}</button>
        </td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    function openForm(){
      const wrap = document.getElementById('formWrap');
      wrap.style.display='block';
      wrap.innerHTML = `
        <div class="card" style="max-width:520px;margin-top:var(--space-12)">
          <div class="dashboard-user-name" style="font-size:18px;margin-bottom:var(--space-12)">Add student</div>
          <form id="stuForm" novalidate>
            <div class="field"><label class="lbl">Full name</label><input type="text" id="snName" class="input" required></div>
            <div class="field"><label class="lbl">Email</label><input type="email" id="snEmail" class="input" required></div>
            <div class="field"><label class="lbl">Phone</label><input type="tel" id="snPhone" class="input"></div>
            <div class="field-error" id="snErr" style="margin-bottom:var(--space-10)"></div>
            <div class="form-actions"><button type="button" class="btn sec" onclick="document.getElementById('formWrap').style.display='none'">Cancel</button><button type="submit" class="btn pri full">Create</button></div>
          </form>
        </div>`;
      document.getElementById('stuForm').onsubmit = (e)=>{
        e.preventDefault(); document.getElementById('snErr').textContent='';
        const res = mem.createUser({ name:document.getElementById('snName').value.trim(), email:document.getElementById('snEmail').value.trim(), phone:document.getElementById('snPhone').value.trim(), role:'student', status:'active', password:'demo1234' });
        if(res.ok){ notify.success('Student created.'); document.getElementById('formWrap').style.display='none'; render(); }
        else { document.getElementById('snErr').textContent = res.error||'Failed.'; }
      };
    }
    window.setStatus = (id,status) => { const r = mem.setUserStatus(id,status); if(r.ok){ notify.success(`Student ${status}.`); render(); } else { notify.error(r.error); } };
    logoutBtn.addEventListener('click',(e)=>{e.preventDefault();auth.logout();notify.success('Logged out.');setTimeout(()=>{window.location.href='../login.html';},600);});
    mobileBtn.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open');});
    overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open');});
    if(!app.requireRole(['admin','superadmin'])) return;
    render();
  </script>
</body>
</html>
