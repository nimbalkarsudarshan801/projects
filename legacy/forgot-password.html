<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Reset your SraswatiLibrary password.">
  <title>SraswatiLibrary — Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/public.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="demo-badge-container" style="position:fixed;top:10px;right:10px;z-index:200;"></div>

  <nav class="public-nav">
    <div class="brand">Sraswati<span style="color:#FFC247">Library</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Log in</a>
    </div>
  </nav>

  <div style="display:flex;flex:1;align-items:center;justify-content:center;padding:var(--space-16)">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">Sraswati<span style="color:#FFC247">Library</span></div>
        <p style="color:var(--text-muted);font-size:14px">Enter your email and we will send a password-reset link.</p>
      </div>
      <form id="forgotForm" novalidate>
        <div class="field">
          <label class="lbl">Email address</label>
          <input type="email" id="email" name="email" class="input" placeholder="riya@student.example" required autocomplete="email">
          <div class="field-error" id="emailError"></div>
        </div>
        <div class="field-error" id="formError" style="margin-bottom:var(--space-12)"></div>
        <div class="form-actions">
          <button type="button" class="btn sec" onclick="window.location.href='login.html'">Cancel</button>
          <button type="submit" class="btn pri full" id="sendBtn">Send reset link</button>
        </div>
      </form>
      <p style="margin-top:var(--space-12);font-size:13px;color:var(--text-label);text-align:center">
        Demo note: no real email is sent. If an account exists, a reset is simulated. Actual email delivery requires a backend.
      </p>
    </div>
  </div>

  <script type="module">
    import { __sraswati_auth as auth, __sraswati_validators as v, __sraswati_notifications as notify } from './js/app.js';

    const form = document.getElementById('forgotForm');
    const emailEl = document.getElementById('email');
    const emailErr = document.getElementById('emailError');
    const formErr = document.getElementById('formError');
    const btn = document.getElementById('sendBtn');

    emailEl.addEventListener('input', () => { emailErr.textContent = ''; emailEl.classList.remove('error'); });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      emailErr.textContent = ''; emailEl.classList.remove('error'); formErr.textContent = '';
      const r = v.validate({ email: [v.required, v.email] }, { email: emailEl.value });
      if (!r.valid) { emailErr.textContent = r.errors.email; emailEl.classList.add('error'); return; }
      btn.disabled = true; btn.textContent = 'Sending…';
      const res = auth.forgotPassword(emailEl.value.trim());
      btn.disabled = false; btn.textContent = 'Send reset link';
      notify.info(res.message, 'Password reset');
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    });
  </script>
</body>
</html>
